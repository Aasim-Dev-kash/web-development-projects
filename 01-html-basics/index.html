<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HTML Basics</title>
</head>
<body>
  <header>
    <h1>My First Web Page</h1>
    <nav>
      <a href="#about">About</a> |
      <a href="#hobbies">Hobbies</a> |
      <a href="#contact">Contact</a>
    </nav>
  </header>

  <main>
    <section id="about">
      <h2>About Me</h2>
      <p>Hello! I'm a first-semester student learning web development.</p>
    </section>

    <section id="hobbies">
      <h2>Hobbies</h2>
      <ul>
        <li>Coding</li>
        <li>Reading</li>
        <li>Music</li>
      </ul>
    </section>

    <section id="contact">
      <h2>Contact</h2>
      <form>
        <label for="name">Name:</label>
        <input type="text" id="name" name="name"><br><br>
        <label for="msg">Message:</label><br>
        <textarea id="msg" name="msg" rows="4" cols="30"></textarea><br><br>
        <button type="submit">Send</button>
      </form>
    </section>
  </main>

  <footer>
    <p>&copy; 2026 Web Development Projects</p>
  </footer>
</body>
</html>
